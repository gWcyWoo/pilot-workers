# GPT via OpenAI's official API. Requires an OpenAI API key.
# `declare: false` — OpenCode's registry already carries the openai provider,
# including which npm package to use and the full model list, so no base_url
# or npm belongs here.
#
# For a ChatGPT Plus/Pro SUBSCRIPTION instead of API credits, use the `codex`
# provider (auth: oauth).
# Docs: https://platform.openai.com/docs/

key: gpt
provider_id: openai
model_id: gpt-5.6
display_name: GPT-5.6 Worker
context_tokens: 1050000
output_tokens: 128000
declare: false
strengths: broad general capability and long context; coding, review, exploration
suitable_modes: code, review, explore, discuss
notes: requires an OpenAI API key; for a ChatGPT subscription use the 'codex' provider instead
